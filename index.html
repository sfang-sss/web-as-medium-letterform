<!DOCTYPE html>
<html>

<head>
    <title>CSS Letters - S</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="letter-container">


        <!-- =========================
             S 01: HORIZONTAL BARS
        ========================== -->

        <div class="s-01">

            <div class="bar bar-1"></div>
            <div class="bar bar-2"></div>
            <div class="bar bar-3"></div>
            <div class="bar bar-4"></div>
            <div class="bar bar-5"></div>

        </div>


        <!-- =========================
             S 02: CIRCLES
        ========================== -->

        <div class="s-02">

            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>
            <div class="circle circle-3"></div>
            <div class="circle circle-4"></div>
            <div class="circle circle-5"></div>
            <div class="circle circle-6"></div>
            <div class="circle circle-7"></div>

        </div>


        <!-- =========================
             S 03: CONTINUOUS BORDER
        ========================== -->

        <div class="s-03">

            <div class="s-line"></div>

        </div>


        <!-- =========================
             S 04: ROTATED RECTANGLES
        ========================== -->

        <div class="s-04">

            <div class="piece piece-1"></div>
            <div class="piece piece-2"></div>
            <div class="piece piece-3"></div>
            <div class="piece piece-4"></div>
            <div class="piece piece-5"></div>

        </div>


        <!-- =========================
             S 05: DOTS
        ========================== -->

        <div class="s-05">

            <div class="dot dot-1"></div>
            <div class="dot dot-2"></div>
            <div class="dot dot-3"></div>
            <div class="dot dot-4"></div>
            <div class="dot dot-5"></div>
            <div class="dot dot-6"></div>
            <div class="dot dot-7"></div>
            <div class="dot dot-8"></div>
            <div class="dot dot-9"></div>
            <div class="dot dot-10"></div>
            <div class="dot dot-11"></div>
            <div class="dot dot-12"></div>

        </div>


        <!-- =========================
             S 06: TRIANGLES
        ========================== -->

        <div class="s-06">

            <div class="triangle triangle-1"></div>
            <div class="triangle triangle-2"></div>
            <div class="triangle triangle-3"></div>
            <div class="triangle triangle-4"></div>
            <div class="triangle triangle-5"></div>

        </div>


        <!-- =========================
     S 07: CIRCLES / S CURVES
========================== -->

</div>

    <div class="s-shape">

    <div class="top-semi"></div>

    <div class="diagonal"></div>

    <div class="bottom-semi"></div>

</div>

<div class="ellipses">

    <div class="ellipse ellipse-1"></div>
    <div class="ellipse ellipse-2"></div>
    <div class="ellipse ellipse-3"></div>
    <div class="ellipse ellipse-4"></div>

</div>

</body>

</html>
